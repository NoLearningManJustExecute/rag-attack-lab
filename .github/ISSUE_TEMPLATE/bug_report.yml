name: Bug report
description: Something in the lab does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The lab's planted weaknesses are intentional and are listed in the docs. Please don't report them as bugs.
        For a real security problem, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. rag-lab ingest
        2. rag-lab ask "..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Ollama version, model, and the commit you're on.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
