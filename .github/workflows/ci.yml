name: CI

# Doc-only changes skip CI to save Actions minutes. This is safe because the main
# ruleset has no required status checks. If one is added, a doc-only pull request
# would wait forever for a check that never runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
  # Weekly full run on main, the only run that tests Windows outside pull requests.
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bash on every OS (Git Bash on Windows), so a failing command in a multi-line step fails the step.
defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows minutes cost twice as much as Linux minutes in a private repo, so Windows
        # runs only on pull requests and the weekly schedule. Other runs test Ubuntu only.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'schedule') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      # Actions are pinned to full commit SHAs. Dependabot keeps them updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # Restores pip's download cache, keyed on these files. Packages are still installed each run.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      # Tests use the fake chat provider and fake embeddings: no model, no network, no secrets.
      - name: Run tests
        run: python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: python -m pip install -r requirements-dev.txt

      # Rules and line length live in pyproject.toml under [tool.ruff].
      - name: Lint
        run: ruff check --output-format=github src tests ci

      - name: Check formatting
        run: ruff format --check src tests ci

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-audit
        run: python -m pip install -r requirements-dev.txt

      # Fails on any known vulnerability in requirements.txt, except the four chromadb
      # advisories already reviewed in README.md ("Known dependency advisories").
      # They affect the Chroma HTTP server only, which this lab never starts.
      #   PYSEC-2026-311  = CVE-2026-45829 / GHSA-f4j7-r4q5-qw2c
      #   PYSEC-2026-3813 = CVE-2026-45830 / GHSA-2wm9-hf6c-p5cr
      #   PYSEC-2026-3814 = CVE-2026-45833 / GHSA-36p7-vc44-83pf
      #   PYSEC-2026-3815 = CVE-2026-45831 / GHSA-xph7-9rjv-w5fr
      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  red-team:
    name: Red-team checks (promptfoo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # Restores npm's download cache, keyed on the promptfoo lockfile.
          cache: npm
          cache-dependency-path: ci/promptfoo/package-lock.json

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Install promptfoo
        working-directory: ci/promptfoo
        run: npm ci --no-audit --no-fund

      # promptfoo runs the pipeline through provider.py with the fake chat model and
      # fake embeddings: no model, no network, no secrets. It exits non-zero if any
      # assertion fails, which fails the build.
      - name: Run red-team checks
        working-directory: ci/promptfoo
        env:
          PROMPTFOO_PYTHON: python
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
        run: npm run eval
