[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-attack-lab"
version = "0.1.0"
description = "A deliberately vulnerable RAG app for AI security education. Local only, fake data only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

[project.scripts]
rag-lab = "rag_attack_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Honor the excludes below even when a file is passed explicitly (editors, pre-commit).
force-exclude = true

[tool.ruff.format]
# tools/leak_guard.py is a standalone file shared across repositories; keep it byte-identical.
exclude = ["tools/leak_guard.py"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade, implicit string concatenation
select = ["E", "F", "W", "I", "B", "UP", "ISC"]

[tool.ruff.lint.per-file-ignores]
# The leak guard builds some patterns from explicit pieces so it never matches its own rules.
"tools/leak_guard.py" = ["ISC003"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI arguments as function defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
